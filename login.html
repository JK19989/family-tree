<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家族成員登入</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h1>李氏家族 全功能家譜</h1>
        <p>請登入以存取完整功能</p>
        <form id="login-form">
            <div class="input-group">
                <label for="username">帳號</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="input-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-login">登入</button>
        </form>
        <div id="login-error" class="error-message"></div>
        <div class="guest-login">
            <a href="index.html" id="guest-continue">或以訪客身分繼續 &rarr;</a>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script>
        // 您的 Firebase 專案設定 (請務必換成您自己的！)
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
        apiKey: "AIzaSyBC6OUlxdibSn2LwckWHNE2CRqyNCn2sAc",
        authDomain: "family-tree-8bcb1.firebaseapp.com",
        projectId: "family-tree-8bcb1",
        storageBucket: "family-tree-8bcb1.firebasestorage.app",
        messagingSenderId: "1022926104375",
        appId: "1:1022926104375:web:440e204c9a168bed74dcb2",
        measurementId: "G-VDZ1F294LC"
        };

        // 初始化 Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 將需要的功能附加到 window 物件，讓 auth.js 可以使用
        window.firebaseAuth = auth;
    </script>

    <script src="auth.js"></script>
</body>
</html>
